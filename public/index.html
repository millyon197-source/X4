<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X4 Foundations Live Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121214; color: #e1e1e6; margin: 2rem; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; }
        .card { background: #1d1d22; border-radius: 8px; padding: 1.5rem; border: 1px solid #29292e; }
        h1, h2 { color: #ff9d00; margin-top: 0; }
        .stat { font-size: 1.2rem; margin-bottom: 0.5rem; }
        .stat span { color: #00ffaa; font-weight: bold; }
        pre { background: #0c0c0e; padding: 1rem; border-radius: 4px; overflow-x: auto; color: #a9a9b3; }
    </style>
</head>
<body>

    <h1>X4 Foundations Live Telemetry</h1>
    
    <div class="grid">
        <!-- Player Info Card -->
        <div class="card">
            <h2>Pilot Profile</h2>
            <div class="stat">Pilot: <span id="pilot-name">Loading...</span></div>
            <div class="stat">Credits: <span id="pilot-credits">0</span> Cr</div>
            <div class="stat">Location: <span id="pilot-sector">Unknown</span></div>
            <hr style="border-color: #29292e;">
            <div style="font-size: 0.85rem; color: #7c7c8a;">Last updated: <span id="timestamp">-</span></div>
        </div>

        <!-- Raw JSON Payload Monitor -->
        <div class="card">
            <h2>Raw Telemetry Stream</h2>
            <pre id="raw-stream">Waiting for data from X4 client mod...</pre>
        </div>
    </div>

    <!-- Include Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Listen for live updates broadcasted by the Express server
        socket.on('game_state_changed', (state) => {
            // Update individual UI elements
            document.getElementById('pilot-name').textContent = state.player.name;
            document.getElementById('pilot-credits').textContent = state.player.credits.toLocaleString();
            document.getElementById('pilot-sector').textContent = state.player.sector;
            document.getElementById('timestamp').textContent = state.lastUpdated || 'Never';

            // Update raw stream visualizer
            document.getElementById('raw-stream').textContent = JSON.stringify(state, null, 2);
        });
    </script>
</body>
</html>
